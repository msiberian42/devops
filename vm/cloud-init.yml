#cloud-config

package_update: true
package_upgrade: true

packages:
  - nginx
  - git
  - curl
  - htop

users:
  - name: deploy
    groups:
      - sudo
    shell: /bin/bash
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${ssh_key}

runcmd:
  - [systemctl, enable, nginx]
  - [systemctl, start, nginx]